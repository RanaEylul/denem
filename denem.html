<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Sabit Kamera Testi</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background-color: #111;
        }
        model-viewer {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <model-viewer 
        src="engine_3d_model-v1.glb" 
        alt="Motor Modeli" 
        camera-controls 
        shadow-intensity="1"
        environment-image="neutral"
        camera-orbit="0deg 75deg 5m">
    </model-viewer>

</body>
</html>
